name: Build and push backend image

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch:

jobs:
  build:
    uses: necro-org/workflows/.github/workflows/docker-image.yml@main
    permissions:
      contents: read
      packages: write
    with:
      image: rice-and-beans-api
      context: ./backend
      dockerfile: ./backend/src/Api/Dockerfile
