name: Build and push frontend-store image

on:
  push:
    branches: [main]
    paths:
      - "frontend-store/**"
      - ".github/workflows/frontend-store-image.yml"
  workflow_dispatch:

jobs:
  build:
    uses: necro-org/workflows/.github/workflows/docker-image.yml@main
    permissions:
      contents: read
      packages: write
    with:
      image: rice-and-beans-frontend-store
      context: ./frontend-store
